<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR</title>
    <link rel="stylesheet" href="../css/pr.css">
    <link rel="stylesheet" href="../css/index.css">
</head>
<body>
    <div class="conteneur">
        <header>
            <h1>Mes PR</h1>
        </header>
        <main class="liste-exercices">

            <div class="carte-exercice">
                <h3>Développé Couché</h3>
                <div class="affichage-valeur">
                    <span class="label">Poids max :</span>
                    <span class="valeur" id="poidMaxCoucher">0</span>
                    <span class="label">kg</span>
                    <button class="bouton-modif" id="boutonModifCoucher" title="modifier">+</button>
                </div>
            </div>

            <div class="carte-exercice">
                <h3>Squat</h3>
                <div class="affichage-valeur">
                    <span class="label">Poids max :</span>
                    <span class="valeur" id="poidMaxSquat">0</span>
                    <span class="label">kg</span>
                    <button class="bouton-modif" id="boutonModifSquat" title="modifier">+</button>
                </div>
            </div>

            <div class="carte-exercice">
                <h3>Deadlift</h3>
                <div class="affichage-valeur">
                    <span class="label">Poids max :</span>
                    <span class="valeur" id="poidMaxDeadlift">0</span>
                    <span class="label">kg</span>
                    <button class="bouton-modif" id="boutonModifDeadlift" title="modifier">+</button>
                </div>
            </div>

            <div class="carte-exercice">
                <h3>Nombre de Tractions</h3>
                <div class="affichage-valeur">
                    <span class="label">Répétitions max :</span>
                    <span class="valeur" id="nbMaxTractions">0</span>
                    <span class="label">reps</span>
                    <button class="bouton-modif" id="boutonModifTractions" title="Modifier les tractions">+</button>
                </div>
            </div>
        </main>
    </div>

    <nav class="bottom-nav">
        <a class="nav-item" href="../index.html">
            <span class="icon">💪</span>
            <span class="label1">Récup</span>
        </a>
        <a class="nav-item" href="stats.html">
            <span class="icon">📊</span>
            <span class="label1">Stats</span>
        </a>
        <a class="nav-item active" href="pr.html">
            <span class="icon">🏆</span>
            <span class="label1">PR</span>
        </a>
        <a class="nav-item" href="reglages.html">
            <span class="icon">⚙️</span>
            <span class="label1">Réglages</span>
        </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/pr.js"></script>
</body>
</html>
